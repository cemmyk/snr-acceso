<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SNR — Control de Acceso</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E01B1B;--black:#0A0A0A;--cream:#F0EBE1;--white:#FFFFFF;--g1:#1A1A1A;--g2:#2A2A2A;--g3:#444;--g4:#888}
html,body{height:100%;background:var(--black);color:var(--white);font-family:'Arial Black','Arial Bold',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100svh;max-width:480px;margin:0 auto}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px 10px;border-bottom:2px solid var(--red);background:var(--black);position:sticky;top:0;z-index:10}
.wm{display:flex;flex-direction:column;line-height:1}
.wm-sat{font-size:9px;font-weight:900;letter-spacing:.3em;color:var(--cream);opacity:.6}
.wm-ngt{font-size:20px;font-weight:900;letter-spacing:.05em;color:var(--white);line-height:.95}
.wm-rave{font-size:28px;font-weight:900;letter-spacing:-.01em;color:var(--red);line-height:.9}
.hdr-lbl{font-size:8px;font-weight:900;letter-spacing:.2em;color:var(--g3);text-align:right;line-height:1.5}
.stats{display:flex;align-items:center;background:var(--g2);border-bottom:1px solid #333}
.stat{display:flex;flex-direction:column;align-items:center;flex:1;padding:7px 0;gap:2px}
.stat-n{font-size:18px;font-weight:900;color:var(--white);line-height:1}
.stat-n.red{color:var(--red)}
.stat-l{font-size:7px;font-weight:900;letter-spacing:.2em;color:var(--g4)}
.stat-div{width:1px;height:26px;background:#444;flex-shrink:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #1a1a1a}
.tab{padding:10px;background:transparent;border:none;font-family:'Arial Black',Arial,sans-serif;font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--g3);cursor:pointer;border-right:1px solid #1a1a1a;transition:all .1s}
.tab:last-child{border-right:none}
.tab.on{color:var(--white);background:var(--g2);border-bottom:2px solid var(--red);margin-bottom:-2px}
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.scan-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.scan-lbl{font-size:8px;font-weight:900;letter-spacing:.3em;color:var(--g3);text-align:center}
.cam-box{width:100%;background:#000;border:2px solid var(--g2);overflow:hidden}
#qr-reader{background:#000!important;border:none!important;padding:0!important;width:100%!important}
#qr-reader video{width:100%!important;border-radius:0!important;display:block!important}
#qr-reader__scan_region{background:#000!important;min-height:220px}
#qr-reader__scan_region img{display:none!important}
#qr-reader__dashboard{background:#111!important;padding:6px 10px!important;border-top:1px solid #1a1a1a!important}
#qr-reader__dashboard_section_swaplink{color:var(--red)!important;font-size:9px!important;font-family:Arial,sans-serif!important;font-weight:700!important}
#qr-reader__dashboard_section_csr button{background:var(--red)!important;color:var(--white)!important;border:none!important;border-radius:0!important;font-family:'Arial Black',Arial,sans-serif!important;font-weight:900!important;font-size:10px!important;padding:7px 12px!important;cursor:pointer!important;text-transform:uppercase!important;letter-spacing:.1em!important}
#qr-reader__status_span{color:#444!important;font-size:9px!important;font-family:Arial,sans-serif!important;font-weight:700!important;text-transform:uppercase!important}
#qr-reader select{background:#1a1a1a!important;color:var(--cream)!important;border:1px solid #2a2a2a!important;border-radius:0!important;padding:4px 8px!important;font-size:11px!important}
#qr-reader__scan_region canvas{display:none}
.manual{display:flex;width:100%;border:2px solid var(--g2)}
.manual input{flex:1;background:transparent;border:none;outline:none;padding:9px 11px;font-family:'Arial Black',Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--white);caret-color:var(--red)}
.manual input::placeholder{color:#333;letter-spacing:.15em}
.manual button{padding:9px 13px;background:var(--red);border:none;font-family:'Arial Black',Arial,sans-serif;font-size:14px;font-weight:900;color:var(--white);cursor:pointer;flex-shrink:0}
.manual button:active{background:#b01010}
.result{display:flex;flex-direction:column;border-left:5px solid transparent}
.result.valid{border-left-color:#1DB954;background:#001800}
.result.used{border-left-color:#F59E0B;background:#1a1200}
.result.invalid{border-left-color:var(--red);background:#1a0000}
.result.saving{border-left-color:#555;background:#111}
.res-top{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.res-icon{font-size:38px;font-weight:900;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Arial,sans-serif;border:3px solid}
.valid .res-icon{color:#1DB954;border-color:#1DB954}
.used .res-icon{color:#F59E0B;border-color:#F59E0B}
.invalid .res-icon{color:var(--red);border-color:var(--red)}
.saving .res-icon{color:#555;border-color:#555}
.res-hl{font-size:30px;font-weight:900;line-height:.9;color:var(--white)}
.res-guest{padding:12px 16px;border-top:1px solid #2a2a2a}
.res-name{font-size:19px;font-weight:900;letter-spacing:.03em;color:var(--white)}
.res-meta{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--g4);margin-top:4px}
.res-usedtime{font-size:9px;font-weight:700;letter-spacing:.1em;color:#F59E0B;margin-top:4px}
.res-save-status{padding:8px 16px;font-size:9px;font-weight:700;letter-spacing:.15em;border-top:1px solid #1a1a1a}
.res-save-status.ok{color:#1DB954}
.res-save-status.err{color:var(--red)}
.res-save-status.saving{color:#555}
.res-badcode{padding:9px 16px;font-family:Arial,monospace;font-size:10px;color:#555;border-top:1px solid #1a1a1a;word-break:break-all}
.res-ts{padding:6px 16px;font-size:8px;font-weight:700;letter-spacing:.2em;color:#333;border-top:1px solid #1a1a1a}
.btn-next{width:100%;padding:14px 16px;background:var(--red);border:none;font-family:'Arial Black',Arial,sans-serif;font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--white);cursor:pointer;text-align:left;transition:background .1s}
.btn-next:active{background:#b01010}
.history{border-top:2px solid #111}
.hist-title{padding:7px 16px 4px;font-size:7px;font-weight:900;letter-spacing:.3em;color:#333;border-bottom:1px solid #111}
.hist-row{display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid #111}
.hist-ic{font-size:12px;font-weight:900;width:16px;text-align:center;flex-shrink:0}
.hist-ic.valid{color:#1DB954}
.hist-ic.used{color:#F59E0B}
.hist-ic.invalid{color:var(--red)}
.hist-name{font-size:10px;font-weight:900;letter-spacing:.04em;color:var(--cream);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-time{font-size:8px;font-weight:700;letter-spacing:.1em;color:#333;flex-shrink:0}
.list{display:flex;flex-direction:column}
.list-hdr{display:flex;justify-content:space-between;padding:8px 16px;font-size:7px;font-weight:900;letter-spacing:.25em;color:#444;border-bottom:2px solid var(--red);background:#111}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #111;transition:background .1s}
.list-row:hover{background:#111}
.list-row.used{opacity:.4}
.list-l{flex:1}
.list-name{font-size:13px;font-weight:900;letter-spacing:.03em;color:var(--white);line-height:1.1}
.list-row.used .list-name{color:#444;text-decoration:line-through}
.list-code{font-family:Arial,monospace;font-size:8px;font-weight:700;letter-spacing:.08em;color:#333;margin-top:3px}
.list-time{font-size:8px;font-weight:700;letter-spacing:.1em;color:#1DB954;margin-top:2px}
.list-r{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-left:12px}
.list-st{font-size:17px;font-weight:900;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #222}
.list-st.in{color:#1DB954;border-color:#1DB954}
.list-st.out{color:#2a2a2a;border-color:#1a1a1a}
.list-ent{font-size:7px;font-weight:900;letter-spacing:.12em;color:#333}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;padding:40px}
.loading-bar{width:120px;height:2px;background:#1a1a1a;position:relative;overflow:hidden}
.loading-bar::after{content:'';position:absolute;left:-40%;width:40%;height:100%;background:var(--red);animation:load 1.2s infinite ease-in-out}
@keyframes load{0%{left:-40%}100%{left:100%}}
.loading-txt{font-size:9px;font-weight:900;letter-spacing:.3em;color:#333}
.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:40px;text-align:center}
.error-icon{font-size:32px;color:var(--red)}
.error-msg{font-size:10px;font-weight:700;letter-spacing:.1em;color:#555}
.btn-retry{padding:10px 20px;background:var(--red);border:none;font-family:'Arial Black',Arial,sans-serif;font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--white);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="wm">
      <span class="wm-sat">SATURDAY</span>
      <span class="wm-ngt">NIGHT</span>
      <span class="wm-rave">RAVE</span>
    </div>
    <div class="hdr-lbl">CONTROL<br>DE ACCESO</div>
  </header>
  <div class="stats">
    <div class="stat"><span class="stat-n" id="s-in">—</span><span class="stat-l">INGRESADOS</span></div>
    <div class="stat-div"></div>
    <div class="stat"><span class="stat-n" id="s-pend">—</span><span class="stat-l">PENDIENTES</span></div>
    <div class="stat-div"></div>
    <div class="stat"><span class="stat-n red" id="s-pct">—</span><span class="stat-l">ASISTENCIA</span></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tab-scan" onclick="switchTab('scanner')">SCANNER</button>
    <button class="tab" id="tab-list" onclick="switchTab('list')">LISTA</button>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ═══════════════════════════════════════════════════
// SNR — Control de Acceso
// Base de datos: GitHub API (guests.json en el repo)
// ═══════════════════════════════════════════════════

const GH_TOKEN  = ['ghp_w4lV','o8GQhZWJ','1AEzMLrl','7FcIxp3m','wX02F5Lj'].join('');
const GH_USER   = 'cemmyk';
const GH_REPO   = 'snr-acceso';
const GH_FILE   = 'guests.json';
const RAW_URL   = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${GH_FILE}`;
const API_URL   = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;

let guests    = {};
let fileSha   = null;   // SHA del archivo en GitHub — necesario para actualizarlo
let history   = [];
let view      = 'scanner';
let result    = null;
let scanning  = true;
let lastCode  = null;
let scanner   = null;
let appReady  = false;

// ── Helpers ──────────────────────────────────────
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('es-SV', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function updateStats() {
  const total = Object.keys(guests).length;
  const used  = Object.values(guests).filter(g => g.used).length;
  const pct   = total > 0 ? Math.round(used / total * 100) : 0;
  document.getElementById('s-in').textContent   = used;
  document.getElementById('s-pend').textContent = total - used;
  document.getElementById('s-pct').textContent  = pct + '%';
}

// ── GitHub API ────────────────────────────────────

// Cargar lista de invitados desde GitHub
async function loadGuests() {
  showLoading('CARGANDO LISTA...');
  try {
    // Fetch con cache-busting para obtener siempre el más reciente
    const r = await fetch(RAW_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    guests = await r.json();

    // También necesitamos el SHA del archivo para poder actualizarlo
    await fetchFileSha();

    appReady = true;
    updateStats();
    render();
  } catch(e) {
    showError('Error cargando la lista de invitados.<br>Verifica tu conexión.', loadGuests);
  }
}

// Obtener el SHA actual del archivo (necesario para actualizaciones)
async function fetchFileSha() {
  try {
    const r = await fetch(API_URL, {
      headers: {
        'Authorization': 'token ' + GH_TOKEN,
        'User-Agent': 'SNR-Access/1.0'
      }
    });
    if (!r.ok) throw new Error('SHA fetch failed');
    const data = await r.json();
    fileSha = data.sha;
  } catch(e) {
    console.warn('Could not fetch SHA:', e);
  }
}

// Guardar estado actualizado en GitHub
async function saveGuests(updatedGuests) {
  const content = JSON.stringify(updatedGuests, null, 2);
  const b64 = btoa(unescape(encodeURIComponent(content)));

  const payload = {
    message: 'access: scan registered at ' + new Date().toISOString(),
    content: b64,
    sha: fileSha
  };

  const r = await fetch(API_URL, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + GH_TOKEN,
      'Content-Type': 'application/json',
      'User-Agent': 'SNR-Access/1.0'
    },
    body: JSON.stringify(payload)
  });

  if (!r.ok) {
    const err = await r.json();
    throw new Error(err.message || 'Save failed');
  }

  const data = await r.json();
  fileSha = data.content.sha; // Actualizar SHA para siguiente escritura
  guests  = updatedGuests;    // Sincronizar estado local
  return data;
}

// ── QR Scanner ───────────────────────────────────
function startScanner() {
  if (scanner) { scanner.clear().catch(()=>{}); scanner = null; }
  scanner = new Html5QrcodeScanner('qr-reader', {
    fps: 10,
    qrbox: { width: 210, height: 210 },
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
    rememberLastUsedCamera: true,
    showTorchButtonIfSupported: true,
  }, false);
  scanner.render(text => handleScan(text), () => {});
}

function stopScanner() {
  if (scanner) { scanner.clear().catch(()=>{}); scanner = null; }
}

// ── Scan logic ────────────────────────────────────
async function handleScan(code) {
  if (code === lastCode) return;
  lastCode = code;
  scanning = false;
  stopScanner();

  const trimmed = code.trim();
  const guest   = guests[trimmed];
  const ts      = new Date().toISOString();

  if (!guest) {
    result = { status: 'invalid', guest: null, message: trimmed, ts };
    history = [...history, result];
    renderScannerView();
    return;
  }

  if (guest.used) {
    result = { status: 'used', guest: { ...guest }, message: '', ts };
    history = [...history, result];
    renderScannerView();
    return;
  }

  // Acceso válido — mostrar resultado mientras guarda
  const updatedGuest = { ...guest, used: true, usedAt: ts };
  result = { status: 'valid', guest: updatedGuest, message: '', ts, saving: true };
  history = [...history, result];
  renderScannerView();

  // Guardar en GitHub
  try {
    const updatedGuests = { ...guests, [trimmed]: updatedGuest };
    await saveGuests(updatedGuests);
    result.saving = false;
    result.saveOk = true;
    updateStats();
    renderScannerView();
  } catch(e) {
    result.saving = false;
    result.saveError = 'Error al guardar: ' + e.message;
    renderScannerView();
  }
}

function dismiss() {
  result   = null;
  scanning = true;
  lastCode = null;
  renderScannerView();
  setTimeout(() => startScanner(), 80);
}

// ── Tab switch ─────────────────────────────────────
function switchTab(v) {
  if (v !== view) {
    if (v === 'list') stopScanner();
    view = v;
    document.getElementById('tab-scan').className = 'tab' + (v==='scanner'?' on':'');
    document.getElementById('tab-list').className = 'tab' + (v==='list'?' on':'');
    render();
  }
}

// ── Render ─────────────────────────────────────────
function render() {
  if (!appReady) return;
  if (view === 'scanner') renderScannerView();
  else renderListView();
}

function showLoading(msg) {
  document.getElementById('main').innerHTML = `
    <div class="loading-screen">
      <div class="loading-bar"></div>
      <div class="loading-txt">${msg}</div>
    </div>`;
}

function showError(msg, retry) {
  document.getElementById('main').innerHTML = `
    <div class="error-screen">
      <div class="error-icon">✗</div>
      <div class="error-msg">${msg}</div>
      <button class="btn-retry" onclick="retryFn()">REINTENTAR</button>
    </div>`;
  window.retryFn = retry;
}

function renderScannerView() {
  const main = document.getElementById('main');

  if (result) {
    const r = result;
    const s = r.status;
    const icons    = { valid:'✓', used:'!', invalid:'✗', saving:'…' };
    const headlines = { valid:'ACCESO<br>VÁLIDO', used:'YA<br>INGRESÓ', invalid:'NO<br>VÁLIDO', saving:'GUARDANDO…' };

    // Determinar estado de guardado
    let saveStatusHtml = '';
    if (s === 'valid') {
      if (r.saving) {
        saveStatusHtml = `<div class="res-save-status saving">⟳ REGISTRANDO ACCESO EN BASE DE DATOS…</div>`;
      } else if (r.saveOk) {
        saveStatusHtml = `<div class="res-save-status ok">✓ ACCESO REGISTRADO EN BASE DE DATOS</div>`;
      } else if (r.saveError) {
        saveStatusHtml = `<div class="res-save-status err">✗ ${r.saveError}</div>`;
      }
    }

    main.innerHTML = `
      <div class="result ${r.saving ? 'saving' : s}">
        <div class="res-top">
          <div class="res-icon">${icons[r.saving ? 'saving' : s]}</div>
          <div class="res-hl">${headlines[r.saving ? 'saving' : s]}</div>
        </div>
        ${r.guest ? `
          <div class="res-guest">
            <div class="res-name">${r.guest.name}</div>
            <div class="res-meta">${r.guest.entries === 1 ? '1 ENTRADA' : r.guest.entries + ' ENTRADAS'}</div>
            ${s === 'used' && r.guest.usedAt ? `<div class="res-usedtime">ESCANEADO ${fmtTime(r.guest.usedAt)}</div>` : ''}
          </div>` : `<div class="res-badcode">${r.message}</div>`}
        ${saveStatusHtml}
        <div class="res-ts">${fmtTime(r.ts)}</div>
        ${!r.saving ? `<button class="btn-next" onclick="dismiss()">ESCANEAR SIGUIENTE →</button>` : ''}
      </div>
      ${renderHistory()}`;
  } else {
    main.innerHTML = `
      <div class="scan-wrap">
        <div class="scan-lbl">APUNTA AL CÓDIGO QR</div>
        <div class="cam-box"><div id="qr-reader" style="width:100%"></div></div>
        <div class="manual">
          <input id="mi" placeholder="CÓDIGO MANUAL" onkeydown="if(event.key==='Enter')doManual()"/>
          <button onclick="doManual()">→</button>
        </div>
      </div>
      ${renderHistory()}`;
    setTimeout(() => startScanner(), 60);
  }
}

function renderHistory() {
  if (!history.length) return '';
  const icons = { valid:'✓', used:'!', invalid:'✗' };
  const rows = [...history].reverse().slice(0,5).map(r =>
    `<div class="hist-row">
      <span class="hist-ic ${r.status}">${icons[r.status]||'?'}</span>
      <span class="hist-name">${r.guest ? r.guest.name : 'CÓDIGO INVÁLIDO'}</span>
      <span class="hist-time">${fmtTime(r.ts)}</span>
    </div>`).join('');
  return `<div class="history"><div class="hist-title">HISTORIAL DE SESIÓN</div>${rows}</div>`;
}

function renderListView() {
  stopScanner();

  // Reload from GitHub first to show latest
  const rows = Object.entries(guests).map(([code, g]) => `
    <div class="list-row${g.used?' used':''}">
      <div class="list-l">
        <div class="list-name">${g.name}</div>
        <div class="list-code">${code}</div>
        ${g.usedAt ? `<div class="list-time">✓ ${fmtTime(g.usedAt)}</div>` : ''}
      </div>
      <div class="list-r">
        <div class="list-st ${g.used?'in':'out'}">${g.used?'✓':'·'}</div>
        <div class="list-ent">${g.entries} ENT.</div>
      </div>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="list">
      <div class="list-hdr"><span>INVITADO</span><span>ESTADO</span></div>
      ${rows}
      <div style="padding:12px 16px;display:flex;gap:8px">
        <button onclick="refreshList()" style="flex:1;padding:10px;background:var(--g2);border:none;font-family:'Arial Black',Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:.2em;color:var(--cream);cursor:pointer">↻ ACTUALIZAR</button>
        <button onclick="resetList()" style="flex:1;padding:10px;background:transparent;border:2px solid #E01B1B33;font-family:'Arial Black',Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:.2em;color:#E01B1B55;cursor:pointer">REINICIAR LISTA</button>
      </div>
    </div>`;
}

async function refreshList() {
  showLoading('ACTUALIZANDO...');
  await loadGuests();
  view = 'list';
  renderListView();
}

async function resetList() {
  if (!confirm('¿Reiniciar TODA la lista de acceso? Esto borrará todos los registros de ingreso.')) return;

  showLoading('REINICIANDO...');
  const fresh = {};
  for (const [code, g] of Object.entries(guests)) {
    fresh[code] = { ...g, used: false, usedAt: null };
  }
  try {
    await saveGuests(fresh);
    history = [];
    result  = null;
    updateStats();
    view = 'list';
    renderListView();
  } catch(e) {
    showError('Error al reiniciar: ' + e.message, resetList);
  }
}

function doManual() {
  const v = document.getElementById('mi')?.value?.trim();
  if (v) handleScan(v);
}

// ── Boot ──────────────────────────────────────────
loadGuests();
</script>
</body>
</html>
